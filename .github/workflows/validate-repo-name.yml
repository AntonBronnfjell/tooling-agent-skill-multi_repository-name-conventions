name: Validate repository name

on:
  push:
    branches: ["**"]

jobs:
  validate-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate repository name against the naming convention
        run: python3 scripts/validate_repo_name.py "${{ github.event.repository.name }}" --strict
